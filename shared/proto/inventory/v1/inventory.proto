syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PinkPig16/msGo/shared/proto/inventory/v1;inventoryv1";

// InventoryService управляет каталогом деталей для космических кораблей
service InventoryService {
  // GetPart возвращает деталь по UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse);
  // ListParts return list of ship parts
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

// Тип детали
enum PartType {
  //PART_TYPE_UNSPECIFIED
  PART_TYPE_UNSPECIFIED = 0;
  //PART_TYPE_HULL
  PART_TYPE_HULL = 1;
  //PART_TYPE_ENGINE
  PART_TYPE_ENGINE = 2;
  //PART_TYPE_SHIELD
  PART_TYPE_SHIELD = 3;
  //PART_TYPE_WEAPON
  PART_TYPE_WEAPON = 4;
}

// Part представляет деталь космического корабля
message Part {
  // Уникальный идентификатор детали
  string uuid = 1;
  // Название детали
  string name = 2;
  // Описание детали
  string description = 3;
  // Цена в копейках (5000₽ = 500000)
  int64 price = 4;
  //Ship part type
  PartType part_type = 5;
  // Quantity
  int64 stock_quantity = 6;
  //Create time
  google.protobuf.Timestamp created_at = 7;
}

// Запрос на получение детали по UUID
message GetPartRequest {
  //Uuid
  string uuid = 1;
}

// ListParts request
message ListPartsRequest {
  //Uuid
  repeated string uuids = 1;
  //Ship part type
  PartType part_type = 2;
}

// Returns list of ship parts
message ListPartsResponse {
  // List of parts
  repeated Part parts = 1;
}

//Returns part
message GetPartResponse {
  //Part
  Part part = 1;
}
